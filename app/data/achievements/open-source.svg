<?xml version="1.0" encoding="UTF-8"?>
<!--
Achievement draft "open-source" — steuererklaerung.
The object is a perforated receipt with a rubber stamp imprint; only the motif changes per achievement. Shared frame across all
three apps: 192 x 96 (2:1), 2 px grid, drawn for raster heights 48 and 96 logical px, with a
locked state that keeps the geometry as a muted silhouette. Title and description come from
gettext and are drawn next to the artwork, never inside it.
No text, no raster, no filters, no baked shadows.
-->
<svg width="192" height="96" viewBox="0 0 192 96" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="6" x2="0" y2="90" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f6fbf3"/><stop offset="1" stop-color="#cfe5c8"/></linearGradient>
  </defs>
  <path id="paper" d="M8 6 L11.0 6 A5 5 0 0 0 21.0 6 L27.0 6 A5 5 0 0 0 37.0 6 L43.0 6 A5 5 0 0 0 53.0 6 L59.0 6 A5 5 0 0 0 69.0 6 L75.0 6 A5 5 0 0 0 85.0 6 L91.0 6 A5 5 0 0 0 101.0 6 L107.0 6 A5 5 0 0 0 117.0 6 L123.0 6 A5 5 0 0 0 133.0 6 L139.0 6 A5 5 0 0 0 149.0 6 L155.0 6 A5 5 0 0 0 165.0 6 L171.0 6 A5 5 0 0 0 181.0 6 L184 6 L184 9.4 A5 5 0 0 0 184 19.4 L184 26.2 A5 5 0 0 0 184 36.2 L184 43.0 A5 5 0 0 0 184 53.0 L184 59.8 A5 5 0 0 0 184 69.8 L184 76.6 A5 5 0 0 0 184 86.6 L184 90 L181.0 90 A5 5 0 0 0 171.0 90 L165.0 90 A5 5 0 0 0 155.0 90 L149.0 90 A5 5 0 0 0 139.0 90 L133.0 90 A5 5 0 0 0 123.0 90 L117.0 90 A5 5 0 0 0 107.0 90 L101.0 90 A5 5 0 0 0 91.0 90 L85.0 90 A5 5 0 0 0 75.0 90 L69.0 90 A5 5 0 0 0 59.0 90 L53.0 90 A5 5 0 0 0 43.0 90 L37.0 90 A5 5 0 0 0 27.0 90 L21.0 90 A5 5 0 0 0 11.0 90 L8 90 L8 86.6 A5 5 0 0 0 8 76.6 L8 69.8 A5 5 0 0 0 8 59.8 L8 53.0 A5 5 0 0 0 8 43.0 L8 36.2 A5 5 0 0 0 8 26.2 L8 19.4 A5 5 0 0 0 8 9.4 Z" fill="url(#body)" stroke="#6aa65c" stroke-width="2"/>
  <rect id="paper-frame" x="18" y="16" width="156" height="64" rx="3" fill="none" stroke="#6aa65c" stroke-width="4"/>
  <rect id="bar-1" x="26" y="30" width="50" height="8" rx="4" fill="#6aa65c"/><rect id="bar-2" x="26" y="44" width="50" height="8" rx="4" fill="#6aa65c"/><rect id="bar-3" x="26" y="58" width="38" height="8" rx="4" fill="#6aa65c"/><rect id="bar-4" x="26" y="72" width="30" height="8" rx="4" fill="#2f5238"/>
  <g id="imprint" transform="rotate(-8 128 48)">
    <circle id="ring" cx="128" cy="48" r="32" fill="none" stroke="#2f5238" stroke-width="6"/>
    <g id="motif" transform="translate(128,48) scale(0.95)"><path d="M0 16 V-2 M0 -2 L-12 -11 M0 -2 L12 -11" fill="none" stroke="#2f5238" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="16" r="6" fill="#2f5238"/><circle cx="-13" cy="-13" r="6" fill="#2f5238"/><circle cx="13" cy="-13" r="6" fill="#2f5238"/></g>
  </g>
</svg>
