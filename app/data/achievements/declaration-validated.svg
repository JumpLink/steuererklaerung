<?xml version="1.0" encoding="UTF-8"?>
<!--
Achievement draft "declaration-validated" — steuererklaerung.
Shared base shape across all three apps: a 10-lobe scalloped seal (union of ten discs, so
the rim waves instead of showing cog teeth), an 8 px front profile like the app icons, and
a recessed round field. Only the motif is app-specific. No text, no raster, no filters.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rim" x1="0" y1="8" x2="0" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ec27e"/><stop offset="1" stop-color="#26a269"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="26" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e4f0de"/><stop offset="1" stop-color="#cfe5c8"/>
    </linearGradient>
  </defs>
  <path id="seal-profile" d="M103.35 53.21 A13 13 0 0 1 103.35 78.79 A13 13 0 0 1 88.32 99.47 A13 13 0 0 1 64.00 107.38 A13 13 0 0 1 39.68 99.47 A13 13 0 0 1 24.65 78.79 A13 13 0 0 1 24.65 53.21 A13 13 0 0 1 39.68 32.53 A13 13 0 0 1 64.00 24.62 A13 13 0 0 1 88.32 32.53 A13 13 0 0 1 103.35 53.21 Z" fill="#2f5238"/>
  <path id="seal" d="M103.35 45.21 A13 13 0 0 1 103.35 70.79 A13 13 0 0 1 88.32 91.47 A13 13 0 0 1 64.00 99.38 A13 13 0 0 1 39.68 91.47 A13 13 0 0 1 24.65 70.79 A13 13 0 0 1 24.65 45.21 A13 13 0 0 1 39.68 24.53 A13 13 0 0 1 64.00 16.62 A13 13 0 0 1 88.32 24.53 A13 13 0 0 1 103.35 45.21 Z" fill="url(#rim)"/>
  <circle id="field-bezel" cx="64" cy="58" r="34" fill="#2f5238"/>
  <circle id="field" cx="64" cy="58" r="32" fill="url(#field)"/>
  <g id="motif" transform="translate(0,-2)">
  <path id="doc" d="M46 34 H72 L84 46 V84 A2 2 0 0 1 82 86 H48 A2 2 0 0 1 46 84 Z" fill="#2f5238"/>
  <path id="doc-fold" d="M72 34 L84 46 H74 A2 2 0 0 1 72 44 Z" fill="#cfe5c8"/>
  <path id="doc-check" d="M55 64 L62 71 L77 54" fill="none" stroke="#cfe5c8" stroke-width="9"
