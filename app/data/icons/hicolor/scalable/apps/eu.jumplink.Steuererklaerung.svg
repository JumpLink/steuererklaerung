<?xml version="1.0" encoding="UTF-8"?>
<!--
Steuererklärung A2 — Ordner with loose sheets and an orange Frist flag: the binder is
the archive, the sheets are what is still being filed. Broken silhouette on top.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spine" x1="20" y1="0" x2="38" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a5fb4"/><stop offset="0.5" stop-color="#3584e4"/><stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5f4"/><stop offset="1" stop-color="#9a9996"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f0efed"/>
    </linearGradient>
    <clipPath id="body-clip"><rect x="20" y="30" width="88" height="82" rx="8"/></clipPath>
  </defs>
  <!-- loose sheets behind the binder -->
  <rect id="sheet-back" x="34" y="12" width="64" height="34" rx="4" fill="#c0bfbc"/>
  <rect id="sheet-front" x="28" y="18" width="70" height="30" rx="4" fill="#f6f5f4"/>
  <rect id="sheet-head" x="36" y="24" width="30" height="5" rx="2.5" fill="#3584e4"/>
  <rect id="sheet-line" x="36" y="33" width="44" height="4" rx="2" fill="#c0bfbc"/>
  <!-- Frist flag -->
  <rect id="flag" x="86" y="8" width="10" height="24" rx="3" fill="#ff7800"/>
  <rect id="flag-light" x="86" y="8" width="10" height="2" rx="1" fill="#ffa348"/>
  <!-- front profile -->
  <rect id="profile" x="20" y="30" width="88" height="90" rx="8" fill="#1a5fb4"/>
  <!-- top surface, with a 2px light edge along the top -->
  <rect id="body" x="20" y="30" width="88" height="82" rx="8" fill="#3584e4"/>
  <rect id="top-light" x="38" y="30" width="70" height="2" fill="#62a0ea" clip-path="url(#body-clip)"/>
  <!-- rounded spine: curved, so gradient -->
  <path id="spine-face" d="M38 30 H28 A8 8 0 0 0 20 38 V104 A8 8 0 0 0 28 112 H38 Z" fill="url(#spine)"/>
  <rect id="spine-light" x="22" y="38" width="2" height="66" rx="1" fill="#62a0ea"/>
  <!-- spine label -->
  <rect id="spine-label" x="25" y="60" width="8" height="22" rx="2" fill="#f6f5f4"/>
  <rect id="spine-label-line" x="27" y="64" width="4" height="2" rx="1" fill="#9a9996"/>
  <!-- the two Leitz rings: shadow, then metal -->
  <rect x="22" y="48" width="14" height="8" rx="4" fill="#1a5fb4"/>
  <rect id="ring-top" x="22" y="46" width="14" height="8" rx="4" fill="url(#ring)"/>
  <rect x="22" y="90" width="14" height="8" rx="4" fill="#1a5fb4"/>
  <rect id="ring-bottom" x="22" y="88" width="14" height="8" rx="4" fill="url(#ring)"/>
  <rect x="48" y="46" width="50" height="42" rx="4" fill="#1a5fb4" opacity="0.4" transform="translate(0,2)"/>
  <rect id="label-field" x="48" y="44" width="50" height="42" rx="4" fill="url(#label)"/>
  <rect id="label-line" x="56" y="50" width="34" height="4" rx="2" fill="#c0bfbc"/>
  <path id="check" d="M60 70 l8 8 l16 -18" fill="none" stroke="#26a269" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- finger hole of the lever-arch mechanism, lit from above -->
  <rect id="finger-lip" x="60" y="94" width="26" height="10" rx="5" fill="#62a0ea"/>
  <rect id="finger-hole" x="60" y="92" width="26" height="10" rx="5" fill="#1a5fb4"/>
</svg>
