name: Release

# Tag-triggered, plus a manual run so the whole chain can be exercised without cutting a release.
#
# The point of this workflow is NOT that a package is produced — `gjsify ship` does that in a few
# seconds and a package that builds proves nothing. The point is the two steps after it: INSTALL the
# package with the system package manager, and START what it installed. Both findings that cost the
# most in this project's packaging were invisible until then — `ship` staged the test bundles beside
# the app, and the `Gda` typelib (the whole database layer) had no declared dependency, so the
# package would have installed cleanly and died at the first import on a stranger's machine.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# ERiC (the tax authority's submission library) is bundled into OFFICIAL builds only (licence § 4
# Abs. 1: shipped with our own software as one product). It is cloned from a PRIVATE repo over SSH
# with the secret ERIC_DEPLOY_KEY (a read-only deploy key; GitHub cannot create fine-grained tokens
# through its API). Without the secret (forks, runs from outside PRs) every step below is skipped and
# the build is the one without ERiC. Secrets this workflow reads:
#   ERIC_DEPLOY_KEY     private half of the read-only deploy key on the private repo
#   ERIC_HERSTELLER_ID  the registered Hersteller-ID, baked into official builds (optional)
# A build that contains ERiC is never uploaded as a workflow artifact — those are readable by anyone
# who can read this public repo; it only goes to the release of a tag (the product).
env:
  ERIC_REPO: JumpLink/steuererklaerung-eric
  ERIC_VERSION: "44.3.6.0"

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      # Fedora, because the install proof needs a package manager that resolves the rpm's Requires
      # for real. The same reasoning as ci.yml: every system library named explicitly, nothing
      # arriving transitively.
      image: quay.io/fedora/fedora:44
    steps:
      - name: Install build prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils
          gjs
          libsoup3 json-glib gnutls libnghttp2
          libgda libgda-sqlite
          pango cairo
          gettext
          squashfs-tools file

      # `appimagetool` is the one tool here that is DOWNLOADED rather than installed: nothing
      # packages it, not Fedora and not Debian (ADR 0024 § M5 in gjsify). Pinned by version AND
      # digest. The RUNTIME is pinned separately: appimagetool embeds ~940 KB of ELF into every
      # artifact and, left alone, fetches it from type2-runtime's rolling `continuous` tag on every
      # pack, so the bytes a person executes would come from a tag nothing here can name.
      - name: Install appimagetool and pin its runtime
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          APPIMAGE_RUNTIME_VERSION: "20251108"
          APPIMAGE_RUNTIME_X86_64_SHA256: "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
        run: |
          set -eu
          curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  /usr/local/bin/appimagetool" | sha256sum -c -
          chmod +x /usr/local/bin/appimagetool
          mkdir -p /usr/local/share/gjsify/appimage-runtime
          curl -fsSL -o /usr/local/share/gjsify/appimage-runtime/runtime-x86_64 \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64"
          echo "${APPIMAGE_RUNTIME_X86_64_SHA256}  /usr/local/share/gjsify/appimage-runtime/runtime-x86_64" | sha256sum -c -

      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies
        run: gjsify install --immutable

      # Not `--skip-build`: a release must package what a clean build produces, not whatever
      # happens to be lying in dist/ from an earlier step.
      # BEFORE ship, because `gjsify.ship.localeDir` points at `dist/locale` and nothing else
      # creates it. Without this the package installs with no catalogues at all and every user sees
      # English -- which is indistinguishable from an app nobody has translated, so it would not be
      # reported. `msgfmt` comes from the gettext package added above.
      - name: Compile the translation catalogues
        run: cd app && gjsify run i18n:compile

      - name: Build the app bundle
        run: cd app && gjsify run build:app

      - name: Third-party licences are all decided
        run: cd app && gjsify run check:licenses

      # ERiC for the Linux package: the slim runtime plus the GJS binding that loads it. The binding
      # needs no ERiC to build (it dlopens it at run time), so it is built only when ERiC is bundled.
      - name: Fetch ERiC and build the binding
        id: eric
        env:
          ERIC_DEPLOY_KEY: ${{ secrets.ERIC_DEPLOY_KEY }}
          ERIC_HERSTELLER_ID: ${{ secrets.ERIC_HERSTELLER_ID }}
        run: |
          set -eu
          if [ -z "${ERIC_DEPLOY_KEY:-}" ]; then
            echo "::notice::ERIC_DEPLOY_KEY is not set - building without ERiC"
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dnf install -y --setopt=install_weak_deps=False openssh-clients meson vala gcc glib2-devel gobject-introspection-devel
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ERIC_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --quiet --depth 1 --filter=blob:none --sparse "git@github.com:${ERIC_REPO}.git" /tmp/eric-repo
          git -C /tmp/eric-repo sparse-checkout set --no-cone "/${ERIC_VERSION}/eric-${ERIC_VERSION}-Linux-x86_64.tar.gz"
          rm -f "$key"
          mkdir -p app/.eric-stage
          tar -xzf "/tmp/eric-repo/${ERIC_VERSION}/eric-${ERIC_VERSION}-Linux-x86_64.tar.gz" -C app/.eric-stage
          rm -rf /tmp/eric-repo
          gjsify run -w @steuererklaerung/eric build:meson
          cd app && node dev/ship-eric.ts .eric-stage Linux-x86_64
          echo "fetched=true" >> "$GITHUB_OUTPUT"

      # `appimage` is opt-in through `--target` because it needs a tool the CLI does not carry
      # (ADR 0024). Naming the targets means a missing `appimagetool` fails loudly instead of
      # quietly shipping one format fewer.
      - name: Pack deb, rpm and AppImage
        run: cd app && gjsify ship linux --skip-build --target deb,rpm,appimage

      - name: The AppImage arrived
        run: |
          set -eu
          ls -la app/ship/out
          version=$(node -p "require('./app/package.json').version")
          f="app/ship/out/steuererklaerung-${version}-1.x86_64.AppImage"
          [ -s "$f" ] || { echo "::error::missing or empty artifact: $f"; exit 1; }

      # The package must contain the APP and nothing else. `ship` stages every file beside the
      # bundle, so a stray build output next to it silently becomes part of the release — this is
      # the check that turns that back into a red build instead of a bloated download.
      - name: No test or CLI bundle in the package
        run: |
          set -eu
          LIST=$(rpm -qlp app/ship/out/*.rpm)
          echo "$LIST"
          for stray in test. steuer.gjs.mjs steuer.node.mjs storybook; do
            if echo "$LIST" | grep -q "$stray"; then
              echo "::error::$stray is in the package"; exit 1
            fi
          done

      # THE step. `dnf install` resolves every `Requires:` the package declares — an undeclared
      # runtime dependency fails here instead of on a user's machine after the download.
      - name: Install the package
        run: dnf install -y --setopt=install_weak_deps=False ./app/ship/out/*.rpm

      # And the step after THAT: what was installed has to start. Under Xvfb because a GTK app
      # needs a display, and inside `dbus-run-session` because the devtools control plane — the
      # only way to ask a running GUI whether it is alive — speaks over the session bus.
      # libglvnd-gles + mesa-dri-drivers: GTK4's GL renderer dlopens libGLESv2 and the bare
      # container has neither it nor a software rasteriser, so the app aborted right after
      # exporting devtools. The package does not own these; a desktop always has them.
      - name: Install the runtime the start proof needs
        run: >
          dnf install -y --setopt=install_weak_deps=False
          xorg-x11-server-Xvfb dbus-daemon libglvnd-gles libglvnd-egl mesa-dri-drivers

      - name: The installed app starts
        run: |
          set -eu
          cat > /tmp/prove.sh <<'SH'
          set -eu
          export GJSIFY_DEVTOOLS=1 STEUER_APP_ID=eu.jumplink.Steuererklaerung.CI
          export HOME=/tmp/fresh XDG_DATA_HOME=/tmp/fresh/data XDG_CONFIG_HOME=/tmp/fresh/config
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"
          steuererklaerung &
          APP=$!
          for _ in $(seq 1 60); do
            if gdbus call --session --dest eu.jumplink.Steuererklaerung.CI \
                 --object-path /eu/jumplink/Steuererklaerung/CI/devtools \
                 --method org.gjsify.Devtools.GetStatus >/tmp/status.json 2>/dev/null; then
              echo "the installed app answered:"; cat /tmp/status.json
              kill "$APP" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::the installed app never answered GetStatus — it did not start"
          kill "$APP" 2>/dev/null || true
          exit 1
          SH
          chmod +x /tmp/prove.sh
          # A fresh HOME on purpose: this is the first launch a stranger gets, and the run must
          # prove THAT one works, not one with a config left behind by an earlier step.
          xvfb-run -a dbus-run-session -- /tmp/prove.sh

      - uses: actions/upload-artifact@v4
        if: steps.eric.outputs.fetched != 'true'
        with:
          name: packages
          path: app/ship/out/*

      # Only for a tag — a manual run exercises the chain without publishing anything.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" app/ship/out/* --clobber

  # macOS and Windows packages, assembled on Linux (ADR 0024 § A1: assembly is not host-bound, the
  # Mach-O and PE payloads are only RUN on their own OS). They carry the NODE bundle
  # (`build:app:node`) on node-gi + the GTK closure from `@gjsify/gtk-runtime-*`, not the GJS one.
  # Order matters: the Linux smoke start needs the Linux node_modules, and every
  # `gjsify install --os …` below replaces them, so it comes first.
  package-macos-windows:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:44
    steps:
      - name: Install system prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs
          libsoup3 json-glib gnutls libnghttp2
          pango cairo gtk4 libadwaita
          gettext glib2 msitools zip unzip
          xorg-x11-server-Xvfb dbus-daemon libglvnd-gles libglvnd-egl mesa-dri-drivers

      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: |
            gjsify-tarballs-

      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies
        run: gjsify install --immutable

      # BEFORE ship: `gjsify.ship.localeDir` points at dist/locale, nothing else creates it.
      - name: Compile the catalogues and build the node bundle
        run: cd app && gjsify run i18n:compile && gjsify run build:app:node

      - name: The node bundle starts without koffi
        run: |
          set -eu
          cat > /tmp/prove.sh <<'SH'
          set -eu
          export GJSIFY_DEVTOOLS=1 STEUER_DEMO=1 STEUER_APP_ID=eu.jumplink.Steuererklaerung.CI
          export HOME=/tmp/fresh XDG_DATA_HOME=/tmp/fresh/data XDG_CONFIG_HOME=/tmp/fresh/config
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"
          node app/dist/app/steuer-app.node.mjs &
          APP=$!
          for _ in $(seq 1 60); do
            if gdbus call --session --dest eu.jumplink.Steuererklaerung.CI \
                 --object-path /eu/jumplink/Steuererklaerung/CI/devtools \
                 --method org.gjsify.Devtools.GetStatus >/dev/null 2>&1; then
              echo "the node bundle answered"; kill "$APP" 2>/dev/null || true; exit 0
            fi
            sleep 1
          done
          echo "::error::the node bundle never answered GetStatus"; kill "$APP" 2>/dev/null || true; exit 1
          SH
          chmod +x /tmp/prove.sh
          xvfb-run -a dbus-run-session -- /tmp/prove.sh

      # ERiC for macOS and Windows (see the header): fetch once, stage per platform before each ship.
      - name: Fetch ERiC
        id: eric
        env:
          ERIC_DEPLOY_KEY: ${{ secrets.ERIC_DEPLOY_KEY }}
        run: |
          set -eu
          if [ -z "${ERIC_DEPLOY_KEY:-}" ]; then
            echo "::notice::ERIC_DEPLOY_KEY is not set - building without ERiC"
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dnf install -y --setopt=install_weak_deps=False openssh-clients
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ERIC_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --quiet --depth 1 --filter=blob:none --sparse "git@github.com:${ERIC_REPO}.git" /tmp/eric-repo
          git -C /tmp/eric-repo sparse-checkout set --no-cone "/${ERIC_VERSION}/eric-${ERIC_VERSION}-Darwin-universal.tar.gz" "/${ERIC_VERSION}/eric-${ERIC_VERSION}-Windows-x86_64.tar.gz"
          rm -f "$key"
          for id in Darwin-universal Windows-x86_64; do
            mkdir -p "app/.eric-stage/$id"
            tar -xzf "/tmp/eric-repo/${ERIC_VERSION}/eric-${ERIC_VERSION}-$id.tar.gz" -C "app/.eric-stage/$id"
          done
          rm -rf /tmp/eric-repo
          echo "fetched=true" >> "$GITHUB_OUTPUT"
          echo "ERIC_FETCHED=true" >> "$GITHUB_ENV"

      # `with_eric <platform> <arch> <command…>`: run the command with that platform's ERiC added to the
      # payload (ship-eric.ts patches app/package.json), then put package.json back. Without ERiC
      # it just runs the command.
      - name: Define with_eric
        run: |
          cat > /usr/local/bin/with_eric <<'SH'
          #!/bin/sh
          set -eu
          id="$1"; arch="$2"; shift 2
          if [ "${ERIC_FETCHED:-false}" != "true" ]; then exec "$@"; fi
          cp package.json /tmp/package.json.orig
          trap 'cp /tmp/package.json.orig package.json' EXIT
          ERIC_HERSTELLER_ID="${ERIC_HERSTELLER_ID:-}" node dev/ship-eric.ts ".eric-stage/$id" "$id" "$arch"
          "$@"
          SH
          chmod +x /usr/local/bin/with_eric

      # Naming the target installs the os/cpu-gated optionalDependencies (node-runtime, gtk-runtime,
      # node-gi prebuild) that a plain Linux install skips.
      - name: Ship macOS (arm64)
        env:
          ERIC_HERSTELLER_ID: ${{ secrets.ERIC_HERSTELLER_ID }}
        run: |
          gjsify install --os darwin --cpu arm64 --immutable
          cd app && with_eric Darwin-universal arm64 gjsify ship darwin --arch arm64 --skip-build --target macos-app-zip

      - name: Ship macOS (x64)
        env:
          ERIC_HERSTELLER_ID: ${{ secrets.ERIC_HERSTELLER_ID }}
        run: |
          gjsify install --os darwin --cpu x64 --immutable
          cd app && with_eric Darwin-universal x64 gjsify ship darwin --arch x64 --skip-build --target macos-app-zip

      - name: Ship Windows (x64)
        env:
          ERIC_HERSTELLER_ID: ${{ secrets.ERIC_HERSTELLER_ID }}
        run: |
          gjsify install --os win32 --cpu x64 --immutable
          cd app && with_eric Windows-x86_64 x64 gjsify ship windows --arch x64 --skip-build --target windows-dir-zip,msi

      # `ship` exits 0 after writing nothing when every target is filtered away: assert by name.
      - name: Assert the artifacts arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          for f in \
            "steuererklaerung-${version}-1.macos.arm64.zip" \
            "steuererklaerung-${version}-1.macos.x86_64.zip" \
            "steuererklaerung-${version}-1.windows.x64.zip" \
            "steuererklaerung-${version}-1.x64.msi"; do
            [ -s "$f" ] || { echo "::error::missing or empty artifact: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        if: steps.eric.outputs.fetched != 'true'
        with:
          name: ship-macos-windows
          path: |
            app/ship/out/*.zip
            app/ship/out/*.msi
          compression-level: 0

      # Only for a tag — a manual run exercises the chain without publishing anything.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" app/ship/out/*.zip app/ship/out/*.msi --clobber
