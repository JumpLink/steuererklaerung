name: Release

# Tag-triggered, plus a manual run so the whole chain can be exercised without cutting a release.
#
# The point of this workflow is NOT that a package is produced — `gjsify ship` does that in a few
# seconds and a package that builds proves nothing. The point is the two steps after it: INSTALL the
# package with the system package manager, and START what it installed. Both findings that cost the
# most in this project's packaging were invisible until then — `ship` staged the test bundles beside
# the app, and the `Gda` typelib (the whole database layer) had no declared dependency, so the
# package would have installed cleanly and died at the first import on a stranger's machine.
on:
  push:
    tags: ['v*']
  # `tag` re-runs the Flatpak job against an ALREADY PUBLISHED release: it builds that tag's sources
  # and uploads the bundle to that release only (--clobber). The other jobs are skipped then.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the Flatpak to (e.g. v0.1.1); empty = build only"
        required: false
        type: string

# ERiC (the tax authority's submission library) is bundled into OFFICIAL builds only (licence § 4
# Abs. 1: shipped with our own software as one product). It is cloned from a PRIVATE repo over SSH
# with the secret ERIC_DEPLOY_KEY (a read-only deploy key; GitHub cannot create fine-grained tokens
# through its API). Without the secret (forks, runs from outside PRs) every step below is skipped and
# the build is the one without ERiC. Secrets this workflow reads:
#   ERIC_DEPLOY_KEY     private half of the read-only deploy key on the private repo
#   ERIC_HERSTELLER_ID  the registered Hersteller-ID, baked into official builds (optional)
# A build that contains ERiC is never uploaded as a workflow artifact — those are readable by anyone
# who can read this public repo; it only goes to the release of a tag (the product).
env:
  ERIC_REPO: JumpLink/steuererklaerung-eric
  ERIC_VERSION: "44.3.6.0"

# The repo's default token is read-only; attaching the packages to the release needs write.
permissions:
  contents: write

jobs:
  # libgda 6 for the .deb (#148). Ubuntu 26.04 ships libgda 5 only, so the deb carries its own build
  # (app/dev/ship-gda-deb.sh). It has to be built where the deb's libraries live — libgda links
  # libxml2.so.16 on Ubuntu, Fedora has .so.2 — so this is Ubuntu, not the Fedora container below.
  # Cached on the recipe: the build takes minutes, and its inputs are the script and the pinned
  # tarball digest inside it.
  gda-deb:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the libgda build
        id: cache
        uses: actions/cache@v4
        with:
          path: app/.gda-stage
          key: gda-deb-${{ hashFiles('app/dev/ship-gda-deb.sh') }}

      - name: Build libgda for the deb
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker run --rm -v "$PWD":/w -w /w ubuntu:26.04 app/dev/ship-gda-deb.sh --install-deps

      - uses: actions/upload-artifact@v4
        with:
          name: gda-deb-stage
          path: app/.gda-stage
          include-hidden-files: true
          retention-days: 7

  package:
    if: ${{ !inputs.tag }}
    needs: gda-deb
    runs-on: ubuntu-latest
    outputs:
      eric: ${{ steps.eric.outputs.fetched }}
    container:
      # Fedora, because the install proof needs a package manager that resolves the rpm's Requires
      # for real. The same reasoning as ci.yml: every system library named explicitly, nothing
      # arriving transitively.
      image: quay.io/fedora/fedora:44
    steps:
      - name: Install build prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils
          gjs
          libsoup3 json-glib gnutls libnghttp2
          libgda libgda-sqlite
          pango cairo librsvg2
          gettext
          squashfs-tools file
          gh

      # `appimagetool` is the one tool here that is DOWNLOADED rather than installed: nothing
      # packages it, not Fedora and not Debian (ADR 0024 § M5 in gjsify). Pinned by version AND
      # digest. The RUNTIME is pinned separately: appimagetool embeds ~940 KB of ELF into every
      # artifact and, left alone, fetches it from type2-runtime's rolling `continuous` tag on every
      # pack, so the bytes a person executes would come from a tag nothing here can name.
      - name: Install appimagetool and pin its runtime
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          APPIMAGE_RUNTIME_VERSION: "20251108"
          APPIMAGE_RUNTIME_X86_64_SHA256: "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
        run: |
          set -eu
          curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  /usr/local/bin/appimagetool" | sha256sum -c -
          chmod +x /usr/local/bin/appimagetool
          mkdir -p /usr/local/share/gjsify/appimage-runtime
          curl -fsSL -o /usr/local/share/gjsify/appimage-runtime/runtime-x86_64 \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64"
          echo "${APPIMAGE_RUNTIME_X86_64_SHA256}  /usr/local/share/gjsify/appimage-runtime/runtime-x86_64" | sha256sum -c -

      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies
        run: gjsify install --immutable

      # Not `--skip-build`: a release must package what a clean build produces, not whatever
      # happens to be lying in dist/ from an earlier step.
      # BEFORE ship, because `gjsify.ship.localeDir` points at `dist/locale` and nothing else
      # creates it. Without this the package installs with no catalogues at all and every user sees
      # English -- which is indistinguishable from an app nobody has translated, so it would not be
      # reported. `msgfmt` comes from the gettext package added above.
      - name: Compile the translation catalogues
        run: cd app && gjsify run i18n:compile

      - name: Build the app bundle
        run: cd app && gjsify run build:app

      - name: Third-party licences are all decided
        run: cd app && gjsify run check:licenses

      # The libgda the deb carries (`gjsify.ship.formats.deb`), built by the job above.
      - uses: actions/download-artifact@v4
        with:
          name: gda-deb-stage
          path: app/.gda-stage

      # ERiC for the Linux package: the slim runtime plus the GJS binding that loads it. The binding
      # needs no ERiC to build (it dlopens it at run time), so it is built only when ERiC is bundled.
      - name: Fetch ERiC and build the binding
        id: eric
        env:
          ERIC_DEPLOY_KEY: ${{ secrets.ERIC_DEPLOY_KEY }}
          ERIC_HERSTELLER_ID: ${{ secrets.ERIC_HERSTELLER_ID }}
        run: |
          set -eu
          if [ -z "${ERIC_DEPLOY_KEY:-}" ]; then
            echo "::notice::ERIC_DEPLOY_KEY is not set - building without ERiC"
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dnf install -y --setopt=install_weak_deps=False openssh-clients meson vala gcc glib2-devel gobject-introspection-devel
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ERIC_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --quiet --depth 1 --filter=blob:none --sparse "git@github.com:${ERIC_REPO}.git" /tmp/eric-repo
          git -C /tmp/eric-repo sparse-checkout set --no-cone "/${ERIC_VERSION}/eric-${ERIC_VERSION}-Linux-x86_64.tar.gz"
          rm -f "$key"
          mkdir -p app/.eric-stage
          tar -xzf "/tmp/eric-repo/${ERIC_VERSION}/eric-${ERIC_VERSION}-Linux-x86_64.tar.gz" -C app/.eric-stage
          rm -rf /tmp/eric-repo
          gjsify run -w @steuererklaerung/eric build:meson
          cd app && node dev/ship-eric.ts .eric-stage Linux-x86_64
          echo "fetched=true" >> "$GITHUB_OUTPUT"

      # `appimage` is opt-in through `--target` because it needs a tool the CLI does not carry
      # (ADR 0024). Naming the targets means a missing `appimagetool` fails loudly instead of
      # quietly shipping one format fewer.
      - name: Pack deb, rpm and AppImage
        run: cd app && gjsify ship linux --skip-build --target deb,rpm,appimage

      - name: The AppImage arrived
        run: |
          set -eu
          ls -la app/ship/out
          version=$(node -p "require('./app/package.json').version")
          f="app/ship/out/steuererklaerung-${version}-1.x86_64.AppImage"
          [ -s "$f" ] || { echo "::error::missing or empty artifact: $f"; exit 1; }

      # The package must contain the APP and nothing else. `ship` stages every file beside the
      # bundle, so a stray build output next to it silently becomes part of the release — this is
      # the check that turns that back into a red build instead of a bloated download.
      - name: No test or CLI bundle in the package
        run: |
          set -eu
          LIST=$(rpm -qlp app/ship/out/*.rpm)
          echo "$LIST"
          for stray in test. steuer.gjs.mjs steuer.node.mjs storybook; do
            if echo "$LIST" | grep -q "$stray"; then
              echo "::error::$stray is in the package"; exit 1
            fi
          done

      # The rpm install proof is NOT here: this container carries the build prerequisites (libgda,
      # libgda-sqlite, ...), so an undeclared `Requires:` would be satisfied by accident. It runs in
      # the clean `prove-rpm` job below (#152).

      - uses: actions/upload-artifact@v4
        if: steps.eric.outputs.fetched != 'true'
        with:
          name: packages
          path: app/ship/out/*

      # Only for a tag — a manual run exercises the chain without publishing anything.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # The first job to get here creates the release; the others find it. A parallel job may
          # win the race between view and create, so "already exists" is not an error.
          gh release view -R "$GITHUB_REPOSITORY" "$tag" >/dev/null 2>&1 \
            || gh release create -R "$GITHUB_REPOSITORY" "$tag" --verify-tag --title "Steuererklärung ${tag#v}" --notes "" \
            || gh release view -R "$GITHUB_REPOSITORY" "$tag" >/dev/null
          gh release upload -R "$GITHUB_REPOSITORY" "$tag" app/ship/out/* --clobber

  # The rpm install proof, in a CLEAN Fedora container: nothing but the rpm and what `dnf` resolves
  # from its `Requires:`. The `package` job's container has libgda and libgda-sqlite installed as
  # build prerequisites, which is how an rpm that did not require libgda-sqlite passed (#152).
  # Skipped for a build that contains ERiC, for the same reason as `prove-deb`.
  prove-rpm:
    needs: package
    if: ${{ !inputs.tag && needs.package.outputs.eric != 'true' }}
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:44
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      # `dnf install` resolves every `Requires:` the package declares: an undeclared runtime
      # dependency fails below instead of on a user's machine after the download.
      - name: Install the package
        run: |
          set -eu
          if rpm -q libgda libgda-sqlite; then echo "::error::libgda is already installed - the proof would not test the rpm's Requires"; exit 1; fi
          dnf install -y --setopt=install_weak_deps=False ./packages/*.rpm
          rpm -q libgda libgda-sqlite

      # The demo store opens SQLite through libgda's provider, so a missing libgda-sqlite fails here.
      # Over MCP because it needs no display; the tool count is the proof that the server came up.
      - name: The installed app answers over MCP
        run: |
          set -eu
          export HOME=/tmp/fresh XDG_DATA_HOME=/tmp/fresh/data XDG_CONFIG_HOME=/tmp/fresh/config STEUER_DEMO=1
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | (cat; sleep 15) | timeout 60 steuererklaerung mcp > /tmp/mcp.out || true
          grep -q '"serverInfo"' /tmp/mcp.out || { echo "::error::no initialize answer"; exit 1; }
          n=$(grep '"id":2' /tmp/mcp.out | grep -o '"name":"[a-z_0-9]*"' | wc -l)
          echo "tools: $n"
          [ "$n" -gt 0 ] || { echo "::error::tools/list is empty"; exit 1; }

      # And the GUI: what was installed has to start. Under Xvfb because a GTK app needs a display,
      # and inside `dbus-run-session` because the devtools control plane speaks over the session bus.
      # libglvnd-gles + mesa-dri-drivers: GTK4's GL renderer dlopens libGLESv2 and the bare container
      # has neither it nor a software rasteriser. The package does not own these; a desktop has them.
      - name: Install the runtime the start proof needs
        run: >
          dnf install -y --setopt=install_weak_deps=False
          xorg-x11-server-Xvfb dbus-daemon libglvnd-gles libglvnd-egl mesa-dri-drivers

      - name: The installed app starts
        run: |
          set -eu
          cat > /tmp/prove.sh <<'SH'
          set -eu
          export GJSIFY_DEVTOOLS=1 STEUER_DEMO=1 STEUER_APP_ID=eu.jumplink.Steuererklaerung.CI
          export HOME=/tmp/fresh XDG_DATA_HOME=/tmp/fresh/data XDG_CONFIG_HOME=/tmp/fresh/config
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"
          steuererklaerung &
          APP=$!
          for _ in $(seq 1 60); do
            if gdbus call --session --dest eu.jumplink.Steuererklaerung.CI \
                 --object-path /eu/jumplink/Steuererklaerung/CI/devtools \
                 --method org.gjsify.Devtools.GetStatus >/tmp/status.json 2>/dev/null; then
              echo "the installed app answered:"; cat /tmp/status.json
              kill "$APP" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::the installed app never answered GetStatus - it did not start"
          kill "$APP" 2>/dev/null || true
          exit 1
          SH
          chmod +x /tmp/prove.sh
          # A fresh HOME on purpose: this is the first launch a stranger gets.
          xvfb-run -a dbus-run-session -- /tmp/prove.sh

  # The deb install proof, the twin of the rpm one above, on the distribution the deb is for:
  # Ubuntu 26.04 has gjs 1.88 and no libgda 6, which is exactly what the bundled libgda answers.
  # Skipped for a build that contains ERiC: its artifact is not uploaded (it would be readable by
  # anyone), so there is nothing to download.
  prove-deb:
    needs: package
    if: ${{ !inputs.tag && needs.package.outputs.eric != 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      # `apt-get install ./x.deb` resolves every `Depends:` the package declares, and no libgda is
      # named in them: an undeclared library fails here instead of on a user's machine.
      - name: Install the package
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends ./packages/*.deb
          if dpkg -l | grep -E 'libgda|gir1.2-gda'; then echo "::error::a system libgda was installed - the proof would not test the bundled one"; exit 1; fi

      - name: Install the runtime the start proof needs
        run: >
          apt-get install -y --no-install-recommends
          xvfb xauth dbus libglib2.0-bin libgles2 libegl1 libgl1-mesa-dri

      - name: The installed app starts
        run: |
          set -eu
          cat > /tmp/prove.sh <<'SH'
          set -eu
          export GJSIFY_DEVTOOLS=1 STEUER_DEMO=1 STEUER_APP_ID=eu.jumplink.Steuererklaerung.CI
          export HOME=/tmp/fresh XDG_DATA_HOME=/tmp/fresh/data XDG_CONFIG_HOME=/tmp/fresh/config
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"
          steuererklaerung &
          APP=$!
          for _ in $(seq 1 60); do
            if gdbus call --session --dest eu.jumplink.Steuererklaerung.CI \
                 --object-path /eu/jumplink/Steuererklaerung/CI/devtools \
                 --method org.gjsify.Devtools.GetStatus >/tmp/status.json 2>/dev/null; then
              echo "the installed app answered:"; cat /tmp/status.json
              kill "$APP" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::the installed app never answered GetStatus - it did not start"
          kill "$APP" 2>/dev/null || true
          exit 1
          SH
          # STEUER_DEMO seeds the demo store, which opens SQLite through libgda's provider: a deb
          # whose libgda is half there fails here, not at the first window.
          xvfb-run -a dbus-run-session -- sh /tmp/prove.sh

  # macOS packages: a `.zip` and a `.dmg` per arch, signed and notarised. They carry the NODE bundle
  # (`build:app:node`) on node-gi + the GTK closure `gjsify ship` fetches into its cache, not the
  # GJS one. Unlike Beifahrer (stage on Linux, pack on macOS), the WHOLE job runs on macOS: a stage
  # with ERiC would have to cross jobs as an artifact, and those are readable by anyone (see the
  # header). Signing needs a Mac, so building, adding ERiC and signing happen in one job.
  #
  # The identity is a Developer ID Application certificate, the notary credential an App Store
  # Connect API key. Repository secrets:
  #
  #   APPLE_DEVELOPER_ID_P12_BASE64   the certificate + private key, `base64 -w0`
  #   APPLE_DEVELOPER_ID_P12_PASSWORD its export password
  #   APPLE_NOTARY_KEY_P8             the `AuthKey_<id>.p8` file, as text
  #   APPLE_NOTARY_KEY_ID             the key id
  #   APPLE_NOTARY_ISSUER_ID          the issuer UUID
  #
  # A manual run without all five packs UNSIGNED with a notice; a tag does not, because an unsigned
  # `.app` that Gatekeeper refuses on every Mac is the silent kind of wrong.
  package-macos:
    if: ${{ !inputs.tag }}
    runs-on: macos-latest
    env:
      P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - name: Decide whether to sign
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -eu
          missing=""
          for v in P12_BASE64 P12_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || missing="$missing $v"
          done
          if [ -z "$missing" ]; then
            echo "CAN_SIGN=1" >> "$GITHUB_ENV"
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::a release needs the secrets behind:$missing"
            exit 1
          else
            echo "::notice::not signing, missing:$missing"
          fi

      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-macos-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: |
            gjsify-tarballs-macos-

      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies
        run: gjsify install --immutable

      # `i18n.sh compile` runs msgfmt; Homebrew's gettext is keg-only, so put it on PATH. `ship`
      # renders the SVG app icon into the `.icns` sizes with gjs + Rsvg, which a Linux stage would bring.
      - name: Install gettext and gjs
        run: |
          command -v msgfmt >/dev/null || brew install gettext
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          # cairo-1.0.typelib comes from gobject-introspection, which gjs does not pull in at runtime.
          for f in gjs librsvg gobject-introspection; do
            brew list "$f" >/dev/null 2>&1 || brew install "$f"
          done

      # BEFORE ship: `gjsify.ship.localeDir` points at dist/locale, nothing else creates it.
      - name: Compile the catalogues and build the node bundle
        run: cd app && gjsify run i18n:compile && gjsify run build:app:node

      - name: Fetch ERiC
        id: eric
        env:
          ERIC_DEPLOY_KEY: ${{ secrets.ERIC_DEPLOY_KEY }}
        run: |
          set -eu
          if [ -z "${ERIC_DEPLOY_KEY:-}" ]; then
            echo "::notice::ERIC_DEPLOY_KEY is not set - building without ERiC"
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ERIC_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          repo="$RUNNER_TEMP/eric-repo"
          git clone --quiet --depth 1 --filter=blob:none --sparse "git@github.com:${ERIC_REPO}.git" "$repo"
          git -C "$repo" sparse-checkout set --no-cone "/${ERIC_VERSION}/eric-${ERIC_VERSION}-Darwin-universal.tar.gz"
          rm -f "$key"
          mkdir -p app/.eric-stage/Darwin-universal
          tar -xzf "$repo/${ERIC_VERSION}/eric-${ERIC_VERSION}-Darwin-universal.tar.gz" -C app/.eric-stage/Darwin-universal
          rm -rf "$repo"
          echo "fetched=true" >> "$GITHUB_OUTPUT"
          echo "ERIC_FETCHED=true" >> "$GITHUB_ENV"

      # `with_eric <platform> <arch> <command…>`: see package-windows.
      - name: Define with_eric
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/with_eric" <<'SH'
          #!/bin/sh
          set -eu
          id="$1"; arch="$2"; shift 2
          if [ "${ERIC_FETCHED:-false}" != "true" ]; then exec "$@"; fi
          orig=$(mktemp)
          cp package.json "$orig"
          trap 'cp "$orig" package.json; rm -f "$orig"' EXIT
          ERIC_HERSTELLER_ID="${ERIC_HERSTELLER_ID:-}" node dev/ship-eric.ts ".eric-stage/$id" "$id" "$arch"
          "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/with_eric"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # A throwaway keychain, unlocked for the job. `codesign` cannot prompt on a runner, so the
      # key's partition list is opened to it up front; without that the signature fails with
      # errSecInternalComponent. It is also made the DEFAULT keychain because `notarytool` reads
      # the default one and gjsify passes it no `--keychain`.
      - name: Import the signing identity
        if: ${{ env.CAN_SIGN == '1' }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/identity.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in the .p12"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Store the notary credential
        if: ${{ env.CAN_SIGN == '1' }}
        run: |
          set -eu
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials gjsify-notary \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm -f "$RUNNER_TEMP/notary.p8"

      # Naming the target installs the os/cpu-gated optionalDependencies (node-runtime, node-gi
      # prebuild) for that arch. The GTK closure is not one: `ship` fetches it.
      - name: Ship macOS
        env:
          ERIC_HERSTELLER_ID: ${{ secrets.ERIC_HERSTELLER_ID }}
        run: |
          set -eu
          if [ -z "${SIGN_IDENTITY:-}" ]; then
            echo "::notice::not signing — packing UNSIGNED macOS packages"
            sign=""
          else
            sign="--sign $SIGN_IDENTITY --notarize gjsify-notary"
          fi
          for arch in arm64 x64; do
            gjsify install --os darwin --cpu "$arch" --immutable
            # shellcheck disable=SC2086
            (cd app && with_eric Darwin-universal "$arch" dev/with-koffi.sh darwin "$arch" \
              gjsify ship darwin --arch "$arch" --skip-build --target macos-app-zip,macos-app-dmg $sign)
          done
          ls -la app/ship/out

      # Asserted by name because `ship` exits 0 after writing nothing when every target is filtered
      # away. macOS labels x64 as `x86_64`. koffi loads ERiC (also a user-supplied one), so every
      # package carries it with its native prebuild (issue #131); and `ship` writes the package even
      # when it could not fetch the GTK closure (gjsify/gjsify#2386). Signed, each `.app` and `.dmg`
      # is judged by Gatekeeper with the quarantine bit a browser download carries: a
      # signed-but-not-notarised app passes `codesign --verify` and is refused there.
      - name: Assert and check the macOS packages
        working-directory: app/ship/out
        run: |
          set -eu
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          for pair in arm64:koffi-darwin-arm64 x86_64:koffi-darwin-x64; do
            arch=${pair%%:*} native=${pair#*:}
            zip="steuererklaerung-${version}-1.macos.$arch.zip"
            dmg="steuererklaerung-${version}-1.$arch.dmg"
            for f in "$zip" "$dmg"; do
              [ -s "$f" ] && [ -s "$f.gjsify-release.json" ] \
                || { echo "::error::missing or empty artifact or release record: $f"; exit 1; }
            done
            listing=$(unzip -Z1 "$zip")
            for need in "node_modules/koffi/package.json" "node_modules/koffi/src/koffi/src/static.cjs" "node_modules/@koromix/$native/"; do
              echo "$listing" | grep -q "$need" || { echo "::error::$zip lacks $need"; exit 1; }
            done
            echo "$listing" | grep -q "node_modules/@koromix/$native/.*koffi\.node" || { echo "::error::$zip has no koffi.node for $native"; exit 1; }
            echo "$listing" | grep -qE '/gtk/lib/libgtk-4[^/]*\.dylib$' || { echo "::error::$zip carries no GTK closure"; exit 1; }
            echo "$listing" | grep -q '/gtk/share/icons/Adwaita/index.theme' || { echo "::error::$zip carries no Adwaita icon theme"; exit 1; }
            [ -n "${SIGN_IDENTITY:-}" ] || continue
            quarantine="0083;$(printf %x "$(date +%s)");Safari;"
            check="$RUNNER_TEMP/check-$arch"
            rm -rf "$check" && mkdir "$check"
            ditto -x -k "$zip" "$check"
            app=$(ls -d "$check"/*.app)
            codesign --verify --deep --strict "$app"
            xattr -w com.apple.quarantine "$quarantine" "$app"
            spctl --assess --type execute -vv "$app" 2>&1 | tee "$check.log"
            grep -q "source=Notarized Developer ID" "$check.log" \
              || { echo "::error::$arch is signed but Gatekeeper does not see it as notarised"; exit 1; }
            xcrun stapler validate "$dmg"
            xattr -w com.apple.quarantine "$quarantine" "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg" 2>&1 | tee "$check.log"
            grep -q "source=Notarized Developer ID" "$check.log" \
              || { echo "::error::the $arch dmg is not seen as notarised"; exit 1; }
            rm -rf "$check" "$check.log"
          done

      - name: Remove the signing keychain
        if: ${{ always() && env.CAN_SIGN == '1' }}
        run: |
          security default-keychain -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - uses: actions/upload-artifact@v4
        if: steps.eric.outputs.fetched != 'true'
        with:
          name: ship-macos
          path: |
            app/ship/out/*.zip
            app/ship/out/*.dmg
            app/ship/out/*.gjsify-release.json
          compression-level: 0

      # Only for a tag — a manual run exercises the chain without publishing anything.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # The first job to get here creates the release; the others find it. A parallel job may
          # win the race between view and create, so "already exists" is not an error.
          gh release view -R "$GITHUB_REPOSITORY" "$tag" >/dev/null 2>&1 \
            || gh release create -R "$GITHUB_REPOSITORY" "$tag" --verify-tag --title "Steuererklärung ${tag#v}" --notes "" \
            || gh release view -R "$GITHUB_REPOSITORY" "$tag" >/dev/null
          gh release upload -R "$GITHUB_REPOSITORY" "$tag" app/ship/out/*.zip app/ship/out/*.dmg app/ship/out/*.gjsify-release.json --clobber

  # Windows packages, assembled on Linux (ADR 0024 § A1: assembly is not host-bound, the PE payload
  # is only RUN on Windows). They carry the NODE bundle (`build:app:node`) on node-gi + the GTK
  # closure `gjsify ship` fetches into its cache, not the GJS one. Order matters: the Linux smoke
  # start needs the Linux node_modules, and `gjsify install --os win32` below replaces them, so it
  # comes first.
  package-windows:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:44
    steps:
      - name: Install system prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs
          libsoup3 json-glib gnutls libnghttp2
          pango cairo gtk4 libadwaita
          gettext glib2 msitools zip unzip gh
          xorg-x11-server-Xvfb dbus-daemon libglvnd-gles libglvnd-egl mesa-dri-drivers

      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: |
            gjsify-tarballs-

      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies
        run: gjsify install --immutable

      # BEFORE ship: `gjsify.ship.localeDir` points at dist/locale, nothing else creates it.
      - name: Compile the catalogues and build the node bundle
        run: cd app && gjsify run i18n:compile && gjsify run build:app:node

      - name: The node bundle starts without koffi
        run: |
          set -eu
          cat > /tmp/prove.sh <<'SH'
          set -eu
          export GJSIFY_DEVTOOLS=1 STEUER_DEMO=1 STEUER_APP_ID=eu.jumplink.Steuererklaerung.CI
          export HOME=/tmp/fresh XDG_DATA_HOME=/tmp/fresh/data XDG_CONFIG_HOME=/tmp/fresh/config
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"
          node app/dist/app/steuer-app.node.mjs &
          APP=$!
          for _ in $(seq 1 60); do
            if gdbus call --session --dest eu.jumplink.Steuererklaerung.CI \
                 --object-path /eu/jumplink/Steuererklaerung/CI/devtools \
                 --method org.gjsify.Devtools.GetStatus >/dev/null 2>&1; then
              echo "the node bundle answered"; kill "$APP" 2>/dev/null || true; exit 0
            fi
            sleep 1
          done
          echo "::error::the node bundle never answered GetStatus"; kill "$APP" 2>/dev/null || true; exit 1
          SH
          chmod +x /tmp/prove.sh
          xvfb-run -a dbus-run-session -- /tmp/prove.sh

      # ERiC for Windows (see the header), staged before the ship.
      - name: Fetch ERiC
        id: eric
        env:
          ERIC_DEPLOY_KEY: ${{ secrets.ERIC_DEPLOY_KEY }}
        run: |
          set -eu
          if [ -z "${ERIC_DEPLOY_KEY:-}" ]; then
            echo "::notice::ERIC_DEPLOY_KEY is not set - building without ERiC"
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dnf install -y --setopt=install_weak_deps=False openssh-clients
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ERIC_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --quiet --depth 1 --filter=blob:none --sparse "git@github.com:${ERIC_REPO}.git" /tmp/eric-repo
          git -C /tmp/eric-repo sparse-checkout set --no-cone "/${ERIC_VERSION}/eric-${ERIC_VERSION}-Windows-x86_64.tar.gz"
          rm -f "$key"
          mkdir -p app/.eric-stage/Windows-x86_64
          tar -xzf "/tmp/eric-repo/${ERIC_VERSION}/eric-${ERIC_VERSION}-Windows-x86_64.tar.gz" -C app/.eric-stage/Windows-x86_64
          rm -rf /tmp/eric-repo
          echo "fetched=true" >> "$GITHUB_OUTPUT"
          echo "ERIC_FETCHED=true" >> "$GITHUB_ENV"

      # `with_eric <platform> <arch> <command…>`: run the command with that platform's ERiC added to the
      # payload (ship-eric.ts patches app/package.json), then put package.json back. Without ERiC
      # it just runs the command.
      - name: Define with_eric
        run: |
          cat > /usr/local/bin/with_eric <<'SH'
          #!/bin/sh
          set -eu
          id="$1"; arch="$2"; shift 2
          if [ "${ERIC_FETCHED:-false}" != "true" ]; then exec "$@"; fi
          cp package.json /tmp/package.json.orig
          trap 'cp /tmp/package.json.orig package.json' EXIT
          ERIC_HERSTELLER_ID="${ERIC_HERSTELLER_ID:-}" node dev/ship-eric.ts ".eric-stage/$id" "$id" "$arch"
          "$@"
          SH
          chmod +x /usr/local/bin/with_eric

      # Naming the target installs the os/cpu-gated optionalDependencies (node-runtime, node-gi
      # prebuild) that a plain Linux install skips. The GTK closure is not one: `ship` fetches it.
      - name: Ship Windows (x64)
        env:
          ERIC_HERSTELLER_ID: ${{ secrets.ERIC_HERSTELLER_ID }}
        run: |
          gjsify install --os win32 --cpu x64 --immutable
          cd app && with_eric Windows-x86_64 x64 dev/with-koffi.sh win32 x64 gjsify ship windows --arch x64 --skip-build --target windows-dir-zip,msi

      # `ship` exits 0 after writing nothing when every target is filtered away: assert by name.
      - name: Assert the artifacts arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          for f in \
            "steuererklaerung-${version}-1.windows.x64.zip" \
            "steuererklaerung-${version}-1.x64.msi"; do
            [ -s "$f" ] && [ -s "$f.gjsify-release.json" ] \
              || { echo "::error::missing or empty artifact or release record: $f"; exit 1; }
          done

      # koffi loads ERiC (also a user-supplied one), so every package must carry it with the native
      # prebuild for its platform, whether or not ERiC is bundled (issue #131).
      - name: Assert koffi is in the packages
        working-directory: app/ship/out
        run: |
          set -eu
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          check() {
            zip="$1"; native="$2"
            listing=$(unzip -Z1 "$zip")
            for need in "node_modules/koffi/package.json" "node_modules/koffi/src/koffi/src/static.cjs" "node_modules/@koromix/$native/"; do
              echo "$listing" | grep -q "$need" || { echo "::error::$zip lacks $need"; exit 1; }
            done
            echo "$listing" | grep -q "node_modules/@koromix/$native/.*koffi\.node" || { echo "::error::$zip has no koffi.node for $native"; exit 1; }
          }
          check "steuererklaerung-${version}-1.windows.x64.zip" koffi-win32-x64

      # `gjsify ship` writes the package even when it could not fetch the GTK closure. Up to 0.1.6
      # every macOS and Windows package shipped without one and started only where Homebrew had GTK
      # (gjsify/gjsify#2386).
      - name: Assert the GTK closure is in the packages
        working-directory: app/ship/out
        run: |
          set -eu
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          for zip in "steuererklaerung-${version}-1.windows.x64.zip"; do
            unzip -Z1 "$zip" | grep -qE '/gtk/(lib|bin)/(lib)?gtk-4[^/]*\.(dylib|dll)$' \
              || { echo "::error::$zip carries no GTK closure"; exit 1; }
            unzip -Z1 "$zip" | grep -q '/gtk/share/icons/Adwaita/index.theme' \
              || { echo "::error::$zip carries no Adwaita icon theme"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        if: steps.eric.outputs.fetched != 'true'
        with:
          name: ship-windows
          path: |
            app/ship/out/*.zip
            app/ship/out/*.msi
            app/ship/out/*.gjsify-release.json
          compression-level: 0

      # Only for a tag — a manual run exercises the chain without publishing anything.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # The first job to get here creates the release; the others find it. A parallel job may
          # win the race between view and create, so "already exists" is not an error.
          gh release view -R "$GITHUB_REPOSITORY" "$tag" >/dev/null 2>&1 \
            || gh release create -R "$GITHUB_REPOSITORY" "$tag" --verify-tag --title "Steuererklärung ${tag#v}" --notes "" \
            || gh release view -R "$GITHUB_REPOSITORY" "$tag" >/dev/null
          gh release upload -R "$GITHUB_REPOSITORY" "$tag" app/ship/out/*.zip app/ship/out/*.msi app/ship/out/*.gjsify-release.json --clobber

  # The Flatpak bundle (`.flatpak`) for a plain `flatpak install`. Same manifest as ci.yml's
  # `flatpak` job, but this one exports and bundles it. The Flathub manifest stays free of ERiC (it
  # builds from public sources only); ERiC's licence allows it solely inside our own official builds,
  # so THIS job adds it to the derived bundle manifest when the deploy key is there, like the other
  # packages do.
  # `--runtime-repo` is what lets `flatpak install x.flatpak` fetch the GNOME runtime from Flathub
  # by itself; without it the install fails on a machine that has not added Flathub.
  # Privileged because flatpak-builder needs namespaces inside a container.
  package-flatpak:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:44
      options: --privileged
    steps:
      - name: Install system prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs flatpak flatpak-builder jq gh

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # ERiC for the bundle, fetched like in the Linux package job. Without the secret (forks) the
      # bundle is built without it.
      - name: Fetch ERiC
        id: eric
        env:
          ERIC_DEPLOY_KEY: ${{ secrets.ERIC_DEPLOY_KEY }}
          ERIC_HERSTELLER_ID: ${{ secrets.ERIC_HERSTELLER_ID }}
        run: |
          set -eu
          if [ -z "${ERIC_DEPLOY_KEY:-}" ]; then
            echo "::notice::ERIC_DEPLOY_KEY is not set - building the Flatpak without ERiC"
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dnf install -y --setopt=install_weak_deps=False openssh-clients
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ERIC_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --quiet --depth 1 --filter=blob:none --sparse "git@github.com:${ERIC_REPO}.git" /tmp/eric-repo
          git -C /tmp/eric-repo sparse-checkout set --no-cone "/${ERIC_VERSION}/eric-${ERIC_VERSION}-Linux-x86_64.tar.gz"
          rm -f "$key"
          mkdir -p app/.eric-stage
          tar -xzf "/tmp/eric-repo/${ERIC_VERSION}/eric-${ERIC_VERSION}-Linux-x86_64.tar.gz" -C app/.eric-stage
          rm -rf /tmp/eric-repo
          if [ -n "${ERIC_HERSTELLER_ID:-}" ]; then
            printf '%s\n' "$ERIC_HERSTELLER_ID" > app/.eric-stage/hersteller-id
          fi
          echo "fetched=true" >> "$GITHUB_OUTPUT"

      # The bundle is built from a variant of the Flathub manifest WITHOUT the `opencode` module: that
      # module is `extra-data`, and flatpak cannot install a single-file bundle of an extra-data app
      # ("Extra data missing in detached metadata", flatpak/flatpak#1334). 0.1.x does not offer the
      # built-in assistant anyway; it returns in 0.2 -- revisit this then. The `git` source becomes
      # this checkout (a container's checkout is not a repo git trusts). Flathub keeps the full manifest.
      #
      # With ERiC fetched, two modules are added HERE and nowhere else: our GJS binding (built from
      # packages/eric with meson, it dlopens ERiC at run time) and the runtime at
      # lib/steuererklaerung/eric/Linux-x86_64. The app looks for `eric/<platform>` upward from the
      # bundle at /app/bin, hence the symlink. No permission changes.
      - name: Derive the bundle manifest and check the sandbox stays narrow
        env:
          ERIC_FETCHED: ${{ steps.eric.outputs.fetched }}
        run: |
          set -eu
          jq 'del(.modules[] | select(.name == "opencode"))
              | (.modules[] | select(.name == "steuererklaerung") | .sources[0]) = {"type":"dir","path":".","skip":[".git",".flatpak-builder","node_modules","app/.eric-stage"]}' \
            eu.jumplink.Steuererklaerung.json > ci-manifest.json
          m=ci-manifest.json
          if [ "$ERIC_FETCHED" = "true" ]; then
            jq '(.modules |= (
                  [.[] | select(.name != "steuererklaerung")]
                  + [{"name":"eric-binding","buildsystem":"meson","sources":[{"type":"dir","path":"packages/eric"}]},
                     {"name":"eric","buildsystem":"simple",
                      "build-commands":[
                        "install -d /app/lib/steuererklaerung/eric/Linux-x86_64",
                        "cp -a . /app/lib/steuererklaerung/eric/Linux-x86_64/",
                        "install -d /app/bin",
                        "ln -s ../lib/steuererklaerung/eric /app/bin/eric"],
                      "sources":[{"type":"dir","path":"app/.eric-stage"}]}]
                  + [.[] | select(.name == "steuererklaerung")]))' "$m" > "$m.tmp"
            mv "$m.tmp" "$m"
          fi
          jq -e '.["finish-args"] | index("--share=network")' "$m" >/dev/null \
            || { echo "::error::$m lacks --share=network"; exit 1; }
          if jq -e '.["finish-args"][] | select(startswith("--filesystem") or . == "--talk-name=org.freedesktop.Flatpak")' "$m" >/dev/null; then
            echo "::error::$m widens the sandbox (--filesystem or org.freedesktop.Flatpak)"; exit 1
          fi
          if jq -e '[.modules[].sources[]? | select(type == "object" and .type == "extra-data")] | length > 0' "$m" >/dev/null; then
            echo "::error::$m still has extra-data, which a single-file bundle cannot carry"; exit 1
          fi
          echo "manifest ok"

      - name: Install the GNOME runtime, SDK and its extensions
        run: |
          set -eu
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --system --noninteractive org.gnome.Platform//50 org.gnome.Sdk//50
          fdo=$(flatpak info --show-metadata org.gnome.Sdk//50 \
            | sed -n '/^\[Extension org.freedesktop.Sdk.Extension\]/,/^\[/s/^version *= *//p')
          test -n "$fdo"
          flatpak install --system --noninteractive \
            "org.freedesktop.Sdk.Extension.node24//$fdo" \
            "org.freedesktop.Sdk.Extension.typescript//$fdo"

      - name: Build and export the Flatpak
        run: |
          set -eu
          flatpak-builder --disable-rofiles-fuse --force-clean --state-dir=/tmp/fp-state \
            --repo=/tmp/fp-repo /tmp/fp-build ci-manifest.json

      - name: Bundle it
        run: |
          set -eu
          version=$(jq -r .version app/package.json)
          mkdir -p flatpak-out
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            /tmp/fp-repo "flatpak-out/eu.jumplink.Steuererklaerung-${version}-1.x86_64.flatpak" \
            eu.jumplink.Steuererklaerung
          ls -la flatpak-out
          [ -s "flatpak-out/eu.jumplink.Steuererklaerung-${version}-1.x86_64.flatpak" ]

      - name: ERiC is in the build when it was fetched
        env:
          ERIC_FETCHED: ${{ steps.eric.outputs.fetched }}
        run: |
          set -eu
          d=/tmp/fp-build/files/lib/steuererklaerung/eric/Linux-x86_64
          if [ "$ERIC_FETCHED" = "true" ]; then
            ls "$d" /tmp/fp-build/files/lib/libsteuereric.so /tmp/fp-build/files/lib/girepository-1.0/SteuerEric-1.0.typelib
            ls "$d"/lib/libericapi.so*
            # The app searches upward from /app/bin, so the symlink has to resolve.
            ls /tmp/fp-build/files/bin/eric/Linux-x86_64/lib/libericapi.so*
          else
            [ ! -e "$d" ] || { echo "::error::ERiC in a build that fetched none"; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: packages-flatpak
          path: flatpak-out/*.flatpak
          compression-level: 0

      # A tag push attaches to its own release; a manual run with `tag` to that existing release.
      # Neither: build only, nothing is published.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          tag="$TAG"
          # The first job to get here creates the release; the others find it. A parallel job may
          # win the race between view and create, so "already exists" is not an error.
          gh release view -R "$GITHUB_REPOSITORY" "$tag" >/dev/null 2>&1 \
            || gh release create -R "$GITHUB_REPOSITORY" "$tag" --verify-tag --title "Steuererklärung ${tag#v}" --notes "" \
            || gh release view -R "$GITHUB_REPOSITORY" "$tag" >/dev/null
          gh release upload -R "$GITHUB_REPOSITORY" "$tag" flatpak-out/*.flatpak --clobber
