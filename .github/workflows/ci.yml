name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

# Fully on the gjsify 0.21 toolchain — no bespoke Node build steps. `gjsify install`
# (native backend, from gjsify-lock.json), `gjsify tsc`, `gjsify build`, and the GJS test
# bundle all run on gjs. Node is present only to bootstrap the gjsify CLI (its published
# bin is Node; its work targets gjs). Runs in a Fedora container that ships `gjs` (which the
# gjsify toolchain spawns) plus the system typelibs the bundles import at load: libgda +
# libgda-sqlite for the store. The GOA/EDS typelibs moved out with the mail code, which now
# lives in its own project (curlew). The 0.12-era all-Node workaround
# (bundler crash + test segfault, node-tsc fallback) is fixed upstream in gjsify 0.13.
#
# EVERY system library is named explicitly — nothing may arrive transitively. `fedora:44` is a
# moving tag, runners cache differently aged layers of it, and `install_weak_deps=False` means
# nothing comes along by accident. On 2026-08-12 two runs of the SAME workflow file 28 minutes
# apart resolved to 104 vs 328 packages; the small one lacked libsoup3 and json-glib and went
# red on an unrelated commit. Whether such a library is present was, until this list, a coin flip.
#
# The failures are also badly signposted: the gjsify CLI loads its native prebuilds at MODULE
# LOAD, so a missing library kills `gjsify tsc`/`gjsify build` before a single line of this
# repo is read — and the error names OUR file, not the container.
#
# The list below is not guesswork. It comes from two enumerations, and BOTH are needed —
# grepping only for `gi://` misses half of it:
#
#  1) Native prebuilds, via their DT_NEEDED set:
#     for so in $(find node_modules/@gjsify -name '*.so'); do objdump -p "$so" | awk '/NEEDED/{print $2}'; done | sort -u
#     → libsoup-3.0 (libsoup3) · libjson-glib-1.0 (json-glib) · libgnutls.so.30 (gnutls)
#       · libnghttp2.so.14 (libnghttp2) · glib/gio/gobject (come with gjs)
#
#  2) Typelibs the code imports. `gi://Namespace` is the ESM form and greppable, but
#     packages/invoice-pdf uses GJS's LEGACY dynamic form (`imports.gi.PangoCairo`,
#     `imports.cairo`), which no static search for `gi://` finds. It cost a CI round to
#     notice: three PDF tests failed with "Requiring PangoCairo … not found".
#     → Gda/GdaSqlite (libgda, libgda-sqlite) · Soup (libsoup3) · PangoCairo (pango, + cairo)
#     Search BOTH forms after a change:  grep -rn "gi://\|imports\.gi\.\|imports\.cairo" src packages
#
# Re-run both after a gjsify bump or a new native dep and extend the list if it grew.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:44
    steps:
      - name: Install system prerequisites (gjs + runtime typelibs + prebuild deps)
        # `appstream` ships metainfo.its: without it xgettext falls back to its built-in appdata
        # rules, splits <description> differently and check-i18n calls the committed .pot stale.
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils
          gjs
          libsoup3 json-glib gnutls libnghttp2
          libgda libgda-sqlite
          pango cairo
          gettext appstream

      - uses: actions/checkout@v4

      # Node 24 to bootstrap + run the gjsify CLI. gjsify's native install-backend prebuilds
      # target node 24 — Fedora's default node 22 loads a mismatched ABI and segfaults
      # gjsify install (verified in a fedora:44 container). Same pattern as the gjsify references.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Content-addressed tarball store: a warm cache lets the install steps below skip the
      # download phase. Keyed on the lockfile.
      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: |
            gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}-
            gjsify-tarballs-

      # Bootstrap the gjsify CLI so `gjsify install` is runnable before node_modules exists
      # (the chicken-and-egg). After install, package scripts resolve node_modules/.bin/gjsify.
      # Read the version from app/package.json so the bootstrap CLI ALWAYS matches the pinned
      # libs — a global-CLI ↔ pinned-libs mismatch produces broken bundles / an unreadable
      # lockfile (a stale bootstrap could not read the 0.29 gjsify-lock.json: "none found").
      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies
        run: gjsify install --immutable

      # EVERY workspace, not a hand-picked two. This step used to name `app` and
      # `packages/eric` explicitly, so the other six packages were type-checked only
      # by whoever remembered to run the root `check` locally — `@steuererklaerung/kredit`
      # had no `check` script at all and was checked nowhere. `foreach -A` is the
      # root `check` script, so a new workspace is covered the day it is added.
      - name: Type check (every workspace)
        run: gjsify run check

      # `format:check` existed as a script and NOTHING called it, so the tree drifted
      # from its own app/.oxfmtrc.json without anything going red — 36 files by the time
      # anyone looked, and the drift predates the 0.38.1 bump entirely (the pinned 0.30.0
      # CLI reported the same 36; both delegate to the same oxfmt 0.56.0). A formatter
      # nobody runs is a formatter that does not exist.
      - name: Format check
        run: cd app && gjsify run format:check

      # The store listing is the first thing a stranger sees. `appstream` is already installed above
      # (appstreamcli); `flatpak-builder-lint` is not, and needs the built manifest, so the manifest
      # lint stays with the flatpak job and only the MetaInfo is checked here, offline.
      - name: MetaInfo passes appstreamcli and the Flathub quality guidelines
        run: cd app && gjsify flatpak check --no-builder-lint --metainfo data/eu.jumplink.Steuererklaerung.metainfo.xml ../eu.jumplink.Steuererklaerung.json

      - name: Build GJS bundle
        run: cd app && gjsify run build:gjs

      # The web client is a separate Vite build; a missing dependency there (@gjsify/app-settings,
      # stubbed as an optional peer) only surfaced when someone ran the full `build`.
      - name: Build web client
        run: cd app && gjsify run build:web

      - name: Assert koffi stays out of the GJS bundle
        run: |
          if grep -q "koffi" app/dist/steuer.gjs.mjs; then
            echo "::error::koffi leaked into the GJS bundle"; exit 1
          fi

      - name: Tests (GJS test bundle under gjs)
        run: cd app && gjsify run test

  # The Flatpak: the manifest must keep the sandbox narrow and carry the bundled opencode, and the
  # whole thing must build offline from gjsify-sources.json. No --filesystem and no
  # org.freedesktop.Flatpak, ever: files go through the portal, and `aiAgentSource: host` is
  # unavailable in the sandbox by design (docs/app/lotse-entwicklung.md).
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:44
      options: --privileged
    steps:
      - name: Install system prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs flatpak flatpak-builder jq

      - uses: actions/checkout@v4

      - name: Check the manifest keeps the sandbox narrow
        run: |
          set -eu
          m=eu.jumplink.Steuererklaerung.json
          jq -e '.["finish-args"] | index("--share=network")' "$m" >/dev/null \
            || { echo "::error::$m lacks --share=network"; exit 1; }
          if jq -e '.["finish-args"][] | select(startswith("--filesystem") or . == "--talk-name=org.freedesktop.Flatpak")' "$m" >/dev/null; then
            echo "::error::$m widens the sandbox (--filesystem or org.freedesktop.Flatpak)"; exit 1
          fi
          jq -e '[.modules[].sources[]? | select(type == "object" and .type == "script" and .["dest-filename"] == "apply_extra")] | length == 1' "$m" >/dev/null \
            || { echo "::error::$m has no apply_extra script (bundled opencode)"; exit 1; }
          echo "manifest ok"

      - name: Install the GNOME runtime, SDK and its extensions
        run: |
          set -eu
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --system --noninteractive org.gnome.Platform//50 org.gnome.Sdk//50
          fdo=$(flatpak info --show-metadata org.gnome.Sdk//50 \
            | sed -n '/^\[Extension org.freedesktop.Sdk.Extension\]/,/^\[/s/^version *= *//p')
          test -n "$fdo"
          flatpak install --system --noninteractive \
            "org.freedesktop.Sdk.Extension.node24//$fdo" \
            "org.freedesktop.Sdk.Extension.typescript//$fdo"

      # Same manifest, one change: the `git` source becomes this checkout.
      - name: Build the Flatpak
        run: |
          set -eu
          jq '(.modules[] | select(.name == "steuererklaerung") | .sources[0]) = {"type":"dir","path":".","skip":[".git",".flatpak-builder","node_modules"]}' \
            eu.jumplink.Steuererklaerung.json > /tmp/ci-manifest.json
          cp /tmp/ci-manifest.json ./ci-manifest.json
          flatpak-builder --disable-rofiles-fuse --force-clean --state-dir=/tmp/fp-state /tmp/fp-build ci-manifest.json

  # macOS and Windows packages, assembled on Linux (ADR 0024 § A1: assembly is not host-bound, the
  # Mach-O and PE payloads are only RUN on their own OS). They carry the NODE bundle
  # (`build:app:node`) on node-gi + the GTK closure from `@gjsify/gtk-runtime-*`, not the GJS one.
  # Order matters: the Linux smoke start needs the Linux node_modules, and every
  # `gjsify install --os …` below replaces them, so it comes first.
  ship-macos-windows:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:44
    steps:
      - name: Install system prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs
          libsoup3 json-glib gnutls libnghttp2
          pango cairo gtk4 libadwaita
          gettext glib2 msitools zip unzip
          xorg-x11-server-Xvfb dbus-daemon libglvnd-gles libglvnd-egl mesa-dri-drivers

      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: |
            gjsify-tarballs-

      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies
        run: gjsify install --immutable

      # BEFORE ship: `gjsify.ship.localeDir` points at dist/locale, nothing else creates it.
      - name: Compile the catalogues and build the node bundle
        run: cd app && gjsify run i18n:compile && gjsify run build:app:node

      - name: The node bundle starts without koffi
        run: |
          set -eu
          cat > /tmp/prove.sh <<'SH'
          set -eu
          export GJSIFY_DEVTOOLS=1 STEUER_DEMO=1 STEUER_APP_ID=eu.jumplink.Steuererklaerung.CI
          export HOME=/tmp/fresh XDG_DATA_HOME=/tmp/fresh/data XDG_CONFIG_HOME=/tmp/fresh/config
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"
          node app/dist/app/steuer-app.node.mjs &
          APP=$!
          for _ in $(seq 1 60); do
            if gdbus call --session --dest eu.jumplink.Steuererklaerung.CI \
                 --object-path /eu/jumplink/Steuererklaerung/CI/devtools \
                 --method org.gjsify.Devtools.GetStatus >/dev/null 2>&1; then
              echo "the node bundle answered"; kill "$APP" 2>/dev/null || true; exit 0
            fi
            sleep 1
          done
          echo "::error::the node bundle never answered GetStatus"; kill "$APP" 2>/dev/null || true; exit 1
          SH
          chmod +x /tmp/prove.sh
          xvfb-run -a dbus-run-session -- /tmp/prove.sh

      # Naming the target installs the os/cpu-gated optionalDependencies (node-runtime, gtk-runtime,
      # node-gi prebuild) that a plain Linux install skips.
      - name: Ship macOS (arm64)
        run: |
          gjsify install --os darwin --cpu arm64 --immutable
          cd app && dev/with-koffi.sh darwin arm64 gjsify ship darwin --arch arm64 --skip-build --target macos-app-zip

      - name: Ship macOS (x64)
        run: |
          gjsify install --os darwin --cpu x64 --immutable
          cd app && dev/with-koffi.sh darwin x64 gjsify ship darwin --arch x64 --skip-build --target macos-app-zip

      - name: Ship Windows (x64)
        run: |
          gjsify install --os win32 --cpu x64 --immutable
          cd app && dev/with-koffi.sh win32 x64 gjsify ship windows --arch x64 --skip-build --target windows-dir-zip,msi

      # `ship` exits 0 after writing nothing when every target is filtered away: assert by name.
      - name: Assert the artifacts arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          for f in \
            "steuererklaerung-${version}-1.macos.arm64.zip" \
            "steuererklaerung-${version}-1.macos.x86_64.zip" \
            "steuererklaerung-${version}-1.windows.x64.zip" \
            "steuererklaerung-${version}-1.x64.msi"; do
            [ -s "$f" ] || { echo "::error::missing or empty artifact: $f"; exit 1; }
          done

      # koffi loads ERiC (also a user-supplied one), so every package must carry it with the native
      # prebuild for its platform, whether or not ERiC is bundled (issue #131).
      - name: Assert koffi is in the packages
        working-directory: app/ship/out
        run: |
          set -eu
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          check() {
            zip="$1"; native="$2"
            listing=$(unzip -Z1 "$zip")
            for need in "node_modules/koffi/package.json" "node_modules/@koromix/$native/"; do
              echo "$listing" | grep -q "$need" || { echo "::error::$zip lacks $need"; exit 1; }
            done
            echo "$listing" | grep -q "node_modules/@koromix/$native/.*koffi\.node" || { echo "::error::$zip has no koffi.node for $native"; exit 1; }
          }
          check "steuererklaerung-${version}-1.windows.x64.zip" koffi-win32-x64
          check "steuererklaerung-${version}-1.macos.arm64.zip" koffi-darwin-arm64
          check "steuererklaerung-${version}-1.macos.x86_64.zip" koffi-darwin-x64

      - uses: actions/upload-artifact@v4
        with:
          name: ship-macos-windows
          path: |
            app/ship/out/*.zip
            app/ship/out/*.msi
          compression-level: 0
